<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Preview — contact-us</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/4.6.2/css/bootstrap.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@200..900&display=swap">
<style>body { font-family: Mulish, sans-serif; color: #3c3c3c; }</style>
</head>
<body>
<style>
/* ==========================================================
   VINFAST EBUS — CONTACT US
   Every selector is scoped to #vf-ebus-scope
   and every class is prefixed "vfe-" to avoid clashes with the theme.
   Mobile-first, desktop layout from 1024px.
   ========================================================== */

#vf-ebus-scope *,
#vf-ebus-scope *::before,
#vf-ebus-scope *::after {
  box-sizing: border-box;
}
#vf-ebus-scope {
  margin: 0;
  font-family: "Mulish", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  font-size: 16px;
  line-height: 24px;
  font-weight: 400;
  color: #3c3c3c;
  background: #fff;
  -webkit-font-smoothing: antialiased;
}
#vf-ebus-scope h1,
#vf-ebus-scope h2,
#vf-ebus-scope h3,
#vf-ebus-scope h4,
#vf-ebus-scope p,
#vf-ebus-scope ul,
#vf-ebus-scope ol,
#vf-ebus-scope dl,
#vf-ebus-scope dd,
#vf-ebus-scope figure {
  margin: 0;
}
#vf-ebus-scope ul,
#vf-ebus-scope ol {
  padding: 0;
  list-style: none;
}
#vf-ebus-scope img {
  display: block;
  max-width: 100%;
  height: auto;
}
/* <picture> only switches sources; let the <img> size against the real parent */
#vf-ebus-scope picture {
  display: contents;
}
#vf-ebus-scope a {
  color: inherit;
  text-decoration: none;
}
#vf-ebus-scope button {
  font: inherit;
  color: inherit;
  background: none;
  border: 0;
  padding: 0;
  cursor: pointer;
}
#vf-ebus-scope :focus-visible {
  outline: 2px solid #1464f4;
  outline-offset: 2px;
}
@media (prefers-reduced-motion: reduce) {
  #vf-ebus-scope *,
  #vf-ebus-scope *::before,
  #vf-ebus-scope *::after {
    transition-duration: 0.01ms !important;
  }
}
/* ---------- CMS guard ----------
   Everything lives under #vf-ebus-scope so theme / Bootstrap rules can't leak in,
   and these styles can't leak out. Neutralise the theme's element styles
   (font, size, colour, margins) so the cut renders like the static build. */
#vf-ebus-scope {
  letter-spacing: normal;
  text-align: start;
}
#vf-ebus-scope :is(h1, h2, h3, h4, h5, h6, p, li, dt, dd, figcaption, blockquote, a, span, strong, small, label, button, input, select, textarea) {
  font-family: inherit;
  letter-spacing: inherit;
  text-transform: none;
}
#vf-ebus-scope :is(h1, h2, h3, h4, h5, h6) {
  line-height: inherit;
  color: inherit;
  font-weight: 700;
}
#vf-ebus-scope h1 { font-size: 2em; }
#vf-ebus-scope h2 { font-size: 1.5em; }
#vf-ebus-scope h3 { font-size: 1.17em; }
#vf-ebus-scope h4 { font-size: 1em; }
#vf-ebus-scope :is(p, li, dt, dd, figcaption, span, label) {
  font-size: inherit;
  line-height: inherit;
  color: inherit;
}
#vf-ebus-scope :is(sup, sub) {
  position: static;
  font-size: smaller;
  line-height: inherit;
}
#vf-ebus-scope sup { vertical-align: super; }
#vf-ebus-scope sub { vertical-align: sub; }
#vf-ebus-scope a:hover {
  text-decoration: none;
}
#vf-ebus-scope button:focus:not(:focus-visible) {
  outline: 0;
}

/* Page gutters. From 1440px up they stay at the Figma paddings (185 / 75 / 155px) */
/* so content grows with the screen like the auto-layout frame; past 1920px the */
/* content stops growing and the gutters take the rest. */
#vf-ebus-scope {
  --pad: 16px;
  --pad-wide: 16px;
  --pad-specs: 16px;
}
@media (min-width: 768px) {
  #vf-ebus-scope {
    --pad: 40px;
    --pad-wide: 40px;
    --pad-specs: 40px;
  }
}
@media (min-width: 1024px) {
  #vf-ebus-scope {
    --pad: max(min(max(40px, 50vw - 535px), 185px), 50vw - 775px);
    --pad-wide: max(min(max(40px, 50vw - 645px), 75px), 50vw - 885px);
    --pad-specs: max(min(max(40px, 50vw - 565px), 155px), 50vw - 805px);
  }
}
/* Containers */
#vf-ebus-scope .vfe-container {
  width: calc(100% - 2 * var(--pad));
  margin-inline: auto;
}
/* Headings */
#vf-ebus-scope .vfe-heading-2 {
  font-size: 32px;
  line-height: 38.4px;
  font-weight: 600;
  color: #3c3c3c;
}
@media (min-width: 1024px) {
  #vf-ebus-scope .vfe-heading-2 {
    font-size: 40px;
    line-height: 48px;
    font-weight: 600;
  }
}
#vf-ebus-scope .vfe-text-body {
  color: rgba(60, 60, 60, 0.9);
}
#vf-ebus-scope .vfe-dots__dot {
  width: 8px;
  height: 8px;
  border-radius: 100px;
  background: #d9e1e2;
  transition: width 0.25s ease, background-color 0.25s ease;
}
#vf-ebus-scope .vfe-dots__dot.is-active {
  width: 24px;
  background: #1464f4;
}
@keyframes vfe-fade-in {
  from {
  opacity: 0;
  }
}
#vf-ebus-scope .vfe-contact-map {
  display: none;
}
@media (min-width: 1024px) {
  #vf-ebus-scope .vfe-contact-map {
    display: block;
    height: 200px;
    overflow: hidden;
  }
  #vf-ebus-scope .vfe-contact-map img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: 50% 33.6%;
    opacity: 0.3;
  }
}
#vf-ebus-scope .vfe-contact {
  padding-block: 24px 133px;
}
@media (min-width: 1024px) {
  #vf-ebus-scope .vfe-contact {
    padding-block: 60px;
  }
}
#vf-ebus-scope .vfe-contact__inner {
  display: flex;
  flex-direction: column;
  gap: 16px;
}
@media (min-width: 1024px) {
  #vf-ebus-scope .vfe-contact__inner {
    gap: 24px;
    max-width: 410px;
    margin-inline: auto;
  }
}
#vf-ebus-scope .vfe-contact a:hover {
  text-decoration: underline;
}
</style>

<!-- ============================================================
     VINFAST EBUS — CONTACT US
     Markup only — build.py wraps it with style.css + ebus.js
     ============================================================ -->
<div id="vf-ebus-scope" class="vfe-page vfe-page--contact-us">

  <div class="vfe-contact-map" aria-hidden="true">
    <img src="https://static-cms-prod.vinfastauto.us/statics/ebus-2026/contact-map.webp" alt="" width="1920" height="1280">
  </div>

  <section class="vfe-contact vfe-container">
    <div class="vfe-contact__inner">
      <h1 class="vfe-heading-2">Contact Us</h1>
      <p class="vfe-text-body">For more information on VinFast eBus sales in the US, connect with our partners at NexMove at <a href="https://www.nexmove.com" target="_blank" rel="noopener">www.nexmove.com</a></p>
    </div>
  </section>


</div>

<script>
/* VinFast eBus — page interactions (vanilla, no dependencies)
   Runs only inside #vf-ebus-scope (the CMS "Body" wrapper); header/footer belong to the CMS.
   Hooks are data-vfe-* attributes so they can't collide with theme/Bootstrap JS. */
(function () {
  'use strict';

  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var EDGE = 8; // px tolerance for sub-pixel snap positions
  var NUDGE = 32; // px left before the end of a carousel that still counts as "at the end"

  function each(list, fn) {
    Array.prototype.forEach.call(list, fn);
  }

  // Dots are only rendered when there is something to paginate
  function renderDots(container, count, onClick) {
    if (!container) return [];
    container.innerHTML = '';
    container.hidden = count < 2;
    var dots = [];
    for (var i = 0; i < count && count > 1; i++) {
      var dot = document.createElement('button');
      dot.type = 'button';
      dot.className = 'vfe-dots__dot';
      dot.setAttribute('aria-label', 'Go to slide ' + (i + 1));
      dot.addEventListener('click', onClick.bind(null, i));
      container.appendChild(dot);
      dots.push(dot);
    }
    return dots;
  }

  /* ---------- Fade slider ([data-vfe-fader]) ----------
     Every element with data-vfe-fade-slide="n" belongs to slide n, so the text
     and the image of one slide may live in different containers. */
  function initFader(root) {
    var slides = root.querySelectorAll('[data-vfe-fade-slide]');
    var count = 0;
    each(slides, function (el) { count = Math.max(count, Number(el.dataset.vfeFadeSlide) + 1); });
    if (!count) return;

    var current = 0;
    var dots = renderDots(root.querySelector('[data-vfe-fade-dots]'), count, go);
    var prevs = root.querySelectorAll('[data-vfe-fade-prev]');
    var nexts = root.querySelectorAll('[data-vfe-fade-next]');
    var loop = root.hasAttribute('data-vfe-fade-loop');

    function go(index) {
      current = loop ? (index + count) % count : Math.max(0, Math.min(count - 1, index));
      each(slides, function (el) {
        var active = Number(el.dataset.vfeFadeSlide) === current;
        el.classList.toggle('is-active', active);
        el.setAttribute('aria-hidden', String(!active));
      });
      dots.forEach(function (dot, i) { dot.classList.toggle('is-active', i === current); });
      if (!loop) {
        each(prevs, function (b) { b.disabled = current === 0; });
        each(nexts, function (b) { b.disabled = current === count - 1; });
      }
    }

    each(prevs, function (b) { b.addEventListener('click', function () { go(current - 1); }); });
    each(nexts, function (b) { b.addEventListener('click', function () { go(current + 1); }); });

    // Swipe on touch devices
    var startX = null;
    root.addEventListener('touchstart', function (e) { startX = e.touches[0].clientX; }, { passive: true });
    root.addEventListener('touchend', function (e) {
      if (startX === null) return;
      var dx = e.changedTouches[0].clientX - startX;
      if (Math.abs(dx) > 40) go(current + (dx < 0 ? 1 : -1));
      startX = null;
    });

    go(0);
  }

  /* ---------- Scroll-snap carousels ([data-vfe-carousel]) ---------- */
  function initCarousel(root) {
    var track = root.querySelector('[data-vfe-carousel-track]');
    if (!track) return null;

    var prevs = root.querySelectorAll('[data-vfe-carousel-prev]');
    var nexts = root.querySelectorAll('[data-vfe-carousel-next]');
    var dotsBox = root.querySelector('[data-vfe-carousel-dots]');
    var start = Number(root.dataset.vfeCarouselStart || 0);
    var dots = [];

    function slides() {
      return Array.prototype.filter.call(track.children, function (el) { return !el.hidden; });
    }

    function step() {
      var items = slides();
      if (items.length < 2) return track.clientWidth;
      return items[1].offsetLeft - items[0].offsetLeft;
    }

    function index() {
      var max = track.scrollWidth - track.clientWidth;
      if (max > EDGE && track.scrollLeft >= max - EDGE) return slides().length - 1;
      return Math.round(track.scrollLeft / step());
    }

    function scrollToIndex(i, instant) {
      // 'instant' (not 'auto') so CSS scroll-behavior: smooth doesn't animate it
      track.scrollTo({ left: i * step(), behavior: instant || reduceMotion ? 'instant' : 'smooth' });
    }

    function update() {
      var max = track.scrollWidth - track.clientWidth;
      each(prevs, function (b) { b.disabled = track.scrollLeft <= EDGE; });
      // A few px left (track padding): a click would only nudge the track, so treat it as the end
      each(nexts, function (b) { b.disabled = track.scrollLeft >= max - NUDGE; });
      var current = index();
      dots.forEach(function (dot, i) { dot.classList.toggle('is-active', i === current); });
    }

    function refresh(startIndex) {
      dots = renderDots(dotsBox, slides().length, scrollToIndex);
      track.scrollLeft = 0;
      if (startIndex) scrollToIndex(startIndex, true);
      update();
    }

    // Arrows go to the nearest snap point at least half a card away. index() can't be used:
    // at the end of the track it returns the last slide, whose snap point may sit only a few
    // px before the end, so "previous" would barely move.
    function move(dir) {
      var s = step();
      var target = dir < 0 ? Math.floor((track.scrollLeft - s / 2) / s) : Math.ceil((track.scrollLeft + s / 2) / s);
      scrollToIndex(Math.max(0, Math.min(target, slides().length - 1)));
    }

    each(prevs, function (b) { b.addEventListener('click', function () { move(-1); }); });
    each(nexts, function (b) { b.addEventListener('click', function () { move(1); }); });

    var ticking = false;
    track.addEventListener('scroll', function () {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () { update(); ticking = false; });
    }, { passive: true });
    window.addEventListener('resize', update);

    enableMouseDrag(track, scrollToIndex, index);
    refresh(start);
    return { refresh: refresh };
  }

  // Lets desktop mouse users drag carousels (some have no arrows on desktop)
  function enableMouseDrag(track, scrollToIndex, index) {
    var startX = 0;
    var startScroll = 0;
    var dragging = false;
    var moved = false;

    track.addEventListener('pointerdown', function (e) {
      if (e.pointerType !== 'mouse' || e.button !== 0) return;
      if (track.scrollWidth <= track.clientWidth) return;
      dragging = true;
      moved = false;
      startX = e.clientX;
      startScroll = track.scrollLeft;
    });

    window.addEventListener('pointermove', function (e) {
      if (!dragging) return;
      var dx = e.clientX - startX;
      if (!moved && Math.abs(dx) < 5) return;
      if (!moved) {
        moved = true;
        track.classList.add('is-dragging');
      }
      track.scrollLeft = startScroll - dx;
    });

    window.addEventListener('pointerup', function () {
      if (!dragging) return;
      dragging = false;
      if (!moved) return;
      track.classList.remove('is-dragging');
      scrollToIndex(index());
    });

    // Swallow the click that ends a drag so links/buttons don't fire
    track.addEventListener('click', function (e) {
      if (!moved) return;
      e.preventDefault();
      e.stopPropagation();
      moved = false;
    }, true);
    track.addEventListener('dragstart', function (e) { e.preventDefault(); });
  }

  /* ---------- EB12 / EB8 switcher ([data-vfe-model-switch]) ---------- */
  function initModelSwitch(scope, carousels) {
    each(scope.querySelectorAll('[data-vfe-model-switch]'), function (section) {
      var tabs = section.querySelectorAll('[data-vfe-model-tab]');
      var carouselRoot = section.querySelector('[data-vfe-carousel]');

      function select(model) {
        each(tabs, function (tab) {
          tab.setAttribute('aria-selected', String(tab.dataset.vfeModelTab === model));
        });
        each(section.querySelectorAll('[data-vfe-model]'), function (el) {
          el.hidden = el.dataset.vfeModel !== model;
        });
        var carousel = carousels.get(carouselRoot);
        if (carousel) carousel.refresh();
      }

      each(tabs, function (tab) {
        tab.addEventListener('click', function () { select(tab.dataset.vfeModelTab); });
      });
    });
  }

  function init() {
    var scope = document.getElementById('vf-ebus-scope');
    if (!scope) return;

    each(scope.querySelectorAll('[data-vfe-fader]'), initFader);

    var carousels = new Map();
    each(scope.querySelectorAll('[data-vfe-carousel]'), function (root) {
      carousels.set(root, initCarousel(root));
    });

    initModelSwitch(scope, carousels);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
  else init();
})();
</script>

</body>
</html>
